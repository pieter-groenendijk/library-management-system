<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${title}">Library Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" th:href="@{/css/home.css}">
  <script defer th:src="@{/js/home.js}"></script>
</head>

<body>
<h1>Create New Loan</h1>
<form th:action="@{/loan/}" th:object="${loanRequestDTO}" method="POST">
  <div>
    <label for="membershipId">Member ID:</label>
    <input type="number" id="membershipId" th:field="*{membershipId}" required>
  </div>
  <div>
    <label for="productId">Product ID:</label>
    <input type="number" id="productId" th:field="*{productCopyId}" required>
  </div>
  <button type="submit">Create Loan</button>
</form>
<div>
  <button onclick="window.location.href='/loan/loanId/{loanId}';">Retrieve a loan by LoanId!</button>
  <button onclick="window.location.href='/loan/membershipId/{membershipId}';">Retrieve a loan by MembershipId!</button>

</div>
</body>
</html>
