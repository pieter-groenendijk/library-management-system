server {
    listen 80;

    # Forward requests to the web-ui service
    location / {
        auth_basic "Restricted Access";          # Prompt message
        auth_basic_user_file /etc/nginx/.htpasswd; # Path to .htpasswd file

        proxy_pass http://web-ui:8080; # Forward to the web-ui service's internal port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}